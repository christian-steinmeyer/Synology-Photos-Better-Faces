name: Headless CPU image
on:
  push:
    branches: [main, feature/native-people-integration]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: python -m compileall -q src/synopticon tests/unit
      - name: Install Python dependencies
        run: |
          pip install uv
          uv sync --extra cpu --extra review --extra faiss
      - name: Run unit tests
        run: uv run --extra cpu --extra review --extra faiss pytest tests/unit/ -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.headless
          target: runtime
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/synology-photos-better-faces:cpu
          cache-from: type=gha
          cache-to: type=gha,mode=max
